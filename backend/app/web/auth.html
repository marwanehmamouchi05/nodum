<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nodum · Sign in & connect Ring</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1c3634;background:#f3f6f4;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center}main{width:100%;max-width:480px;background:white;border:1px solid #d9e3df;border-radius:20px;padding:32px;box-shadow:0 14px 50px #163b3210}h1{font-size:28px;margin:18px 0}p{line-height:1.6;overflow-wrap:anywhere}.brand{font-weight:800;letter-spacing:.12em}label{display:block;margin:18px 0 6px}input,button{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid #acbfb8}button{margin-top:18px;background:#185e50;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button.secondary{background:white;color:#185e50}input:focus-visible,button:focus-visible{outline:3px solid #85c8b7;outline-offset:3px}.muted{font-size:14px;color:#526963}#message{white-space:pre-wrap}[hidden]{display:none!important}@media(max-width:400px){body{padding:12px}main{padding:22px}}
</style><script src="/auth/client.js" defer></script></head>
<body><main><span class="brand">NODUM</span><h1 id="heading">Sign in to Nodum</h1><p id="intro">Use your configured Nodum account to connect Ring.</p>
<form id="login" hidden><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="128"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button type="submit">Sign in</button></form>
<section id="signed-in" hidden><p id="identity"></p><button id="claim" hidden>Confirm and connect Ring</button><button id="logout" class="secondary">Sign out</button></section>
<p id="message" role="status" aria-live="polite">Loading your session…</p><p class="muted">Ring credentials stay on the server. Connecting Ring does not grant building access.</p>
<noscript>JavaScript is required for this secure sign-in and confirmation flow.</noscript></main></body></html>
